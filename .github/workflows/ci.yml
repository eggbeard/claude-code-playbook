name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test 'tools/**/*.test.mjs' 'plugins/**/*.test.mjs'
      - run: node tools/scrub-check.mjs
        env:
          SCRUB_TERMS: ${{ secrets.SCRUB_TERMS }}
